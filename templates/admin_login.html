{% extends "base.html" %}

{% block title %}Login Admin{% endblock %}

{% block content %}
<div class="container" style="max-width: 400px; margin-top: 3rem;">
    <h2 style="text-align:center; margin-bottom: 2rem;">Acceso Administración</h2>

    <form method="POST" action="{% url 'admin_login' %}">
        {% csrf_token %}

        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="usuario" required style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;">
        </div>

        <div class="form-group" style="margin-top: 1rem;">
            <label>Contraseña</label>
            <input type="password" name="password" required style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;">
        </div>

        <button type="submit" class="btn" style="width:100%; margin-top:1.5rem;">Ingresar</button>

        {% if messages %}
            <div style="margin-top:1rem; padding: 1rem; background: #f8d7da; color: #721c24; border-radius: 8px;">
                {% for m in messages %}
                    {{ m }}
                {% endfor %}
            </div>
        {% endif %}
    </form>
</div>
{% endblock %}
